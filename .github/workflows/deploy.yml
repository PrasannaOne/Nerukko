name: Deploy Neruko to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run matchmaking and room-flow checks
        run: npm test

      - name: Prepare bundled sticker assets
        run: |
          mkdir -p public/Stickers
          cp Stickers/*.zip public/Stickers/

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc

      - name: Upload Gemini API key to Worker secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY repository secret is missing."
            exit 1
          fi
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY --config wrangler.jsonc

      - name: Upload TURN provider secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNIX_API_TOKEN: ${{ secrets.TURNIX_API_TOKEN }}
          METERED_APP_NAME: ${{ secrets.METERED_APP_NAME }}
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
        run: |
          set -euo pipefail
          # Optional providers: missing credentials simply leave Neruko on STUN.
          if [ -n "$TURNIX_API_TOKEN" ]; then
            printf '%s' "$TURNIX_API_TOKEN" | npx --yes wrangler@4 secret put TURNIX_API_TOKEN --config wrangler.jsonc
          else
            echo "TURNIX_API_TOKEN is not configured; Turnix relay will be disabled."
          fi
          if [ -n "$METERED_APP_NAME" ] && [ -n "$METERED_TURN_API_KEY" ]; then
            printf '%s' "$METERED_APP_NAME" | npx --yes wrangler@4 secret put METERED_APP_NAME --config wrangler.jsonc
            printf '%s' "$METERED_TURN_API_KEY" | npx --yes wrangler@4 secret put METERED_TURN_API_KEY --config wrangler.jsonc
          else
            echo "Metered secrets are incomplete; Metered relay will be disabled."
          fi
          
